<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video And Audio Files</title>
</head>
<body>
    <h2>Video Files</h2>
    <nav>
        <ol>
            <li>1.mp4</li>
            <li>2.mp4</li>
            <li>3.mp4</li>
            <li>4.mp4</li>
        </ol>
    </nav>
    <nav>
        <video src="1.mp4" controls height="200" width="300" muted></video>
        <video src="2.mp4" controls height="200" width="300" muted></video>
        <video src="3.mp4" controls height="200" width="300" muted></video>
        <video src="4.mp4" controls height="200" width="300" muted></video>
    </nav>
    <h2>Audio Files</h2>
    <nav>
        <ol>
            <li>1.mp3</li>
            <li>2.mp3</li>
            <li>3.mp3</li>
            <li>4.mp3</li>
        </ol>
    </nav>
    <nav>
        <audio src="1.mp3" controls muted></audio>
        <audio src="2.mp3" controls muted></audio>
        <audio src="3.mp3" controls muted></audio>
        <audio src="4.mp3" controls muted></audio>
    </nav>
</body>
</html>
